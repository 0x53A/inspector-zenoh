[workspace]

[package]
name = "inspector-zenoh-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
inspector-zenoh = { path = ".." }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

# hiroz currently names the crates.io Zenoh packages internally. For a WASM
# build Cargo therefore has to redirect those packages to the published fork.
# This manifest is intentionally separate so these overrides can never enter
# the native dependency graph.
[patch.crates-io]
# Keep all patched packages on the same fork branch. Mixing `branch` and `rev`
# source declarations makes Cargo link duplicate copies of the same crates.
zenoh = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-ext = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-buffers = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-codec = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-collections = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-config = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-core = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-crypto = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-keyexpr = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-link = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-link-commons = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-macros = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-plugin-trait = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-protocol = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-result = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-runtime = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-shm = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-sync = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-task = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-transport = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
zenoh-util = { git = "https://github.com/0x53A/zenoh.git", branch = "wasm" }
